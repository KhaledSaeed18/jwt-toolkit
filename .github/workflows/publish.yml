# The file name and the `pypi` environment are registered with PyPI Trusted
# Publishing; renaming either breaks publishing until PyPI is updated too.
name: Release

on:
  # release-please keeps a release PR up to date. Merging it tags the commit,
  # creates the GitHub Release, and this same run validates, builds and publishes.
  # (A release made with GITHUB_TOKEN cannot trigger another workflow.)
  push:
    branches: [main]
  # Recovery for an existing release tag: gh workflow run publish.yml --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  target:
    name: Pick the release to publish
    needs: release-please
    if: >-
      always() && needs.release-please.result != 'failure' && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve and check the release tag
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          NEW_TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF_TYPE" != "tag" ]; then
              echo "::error::Run the recovery publish on a release tag: gh workflow run publish.yml --ref vX.Y.Z"
              exit 1
            fi
            tag="$REF_NAME"
          else
            tag="$NEW_TAG"
            git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag"
          fi
          if [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$SHA" ]; then
            echo "::error::Tag $tag does not point at the commit this run validates ($SHA)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The full CI gate (lint, types, security, tests on every OS and Python, package
  # smoke test) on the exact commit being released.
  validate:
    name: Validate release commit
    needs: target
    permissions:
      contents: read
    # The newer self-repository form ($/...) is not verified for job-level reusable
    # workflows yet, and this path only runs at release time, so keep the proven form.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  build:
    name: Build distribution
    needs: [target, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.target.outputs.tag }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # A release build never restores a cache another run could have written.
          enable-cache: false
      - name: Require the tag to match the package version
        env:
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the package version $version"
            exit 1
          fi
      - name: Build sdist + wheel
        run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jwt-toolkit
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing + PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
