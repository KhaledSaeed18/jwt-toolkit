name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow run this same gate on the commit it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancelled; main and release runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --locked --group dev
      - name: Ruff format (check only)
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Workflow security lint (zizmor)
        run: uv run zizmor --offline --persona=regular .github/workflows

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run mypy

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Bandit static analysis
        run: uv run bandit -c pyproject.toml -r jwt_toolkit --severity-level medium
      - name: pip-audit dependency CVEs
        run: uv run pip-audit

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported CPython on Linux and Windows (crack's worker processes
        # use spawn there), plus the minimum on macOS. Keep in sync with the
        # pyproject classifiers and the README "Installation" section.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.13"
    env:
      COVERAGE_CELL: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml -n auto
      - name: Upload coverage artifact
        if: always() && env.COVERAGE_CELL == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --group dev
      # Builds both artifacts, checks their contents and metadata, then runs the
      # installed entry point from fresh venvs outside the repository.
      - name: Build, check and smoke-test the installed package
        run: uv run python scripts/package_check.py --keep-venv "${{ runner.temp }}/pkg-env"
      - name: Set up Node for cliprobe
        if: runner.os == 'Linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # --strict: a warning (color in a pipe, NO_COLOR ignored, a prompt) fails too.
      - name: cliprobe self-check
        if: runner.os == 'Linux'
        run: uv run python scripts/run_cliprobe.py --strict "${{ runner.temp }}/pkg-env"
