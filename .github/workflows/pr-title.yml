name: PR title

# Squash merges use the PR title as the commit message on main, and release-please
# reads it to pick the next version, so the title must follow Conventional Commits.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_commit_message.py --max-length 100 --title "$TITLE"
